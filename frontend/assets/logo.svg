<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Leaf Core Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Ribbon 1 Gradient (Top Right) -->
    <linearGradient id="ribbon1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Ribbon 2 Gradient (Bottom) -->
    <linearGradient id="ribbon2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Ribbon 3 Gradient (Left) -->
    <linearGradient id="ribbon3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#022c22" flood-opacity="0.35" />
    </filter>

    <!-- Inner Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base -->
  <rect width="128" height="128" rx="30" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Subtle Highlight Border -->
  <rect width="126" height="126" x="1" y="1" rx="29" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" />

  <!-- Background Decorative Geo Rings -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" stroke-dasharray="4 6" />

  <!-- Dynamic Circular Loop Arrows (Recycle Möbius Stream) -->
  <g transform="translate(64, 64) scale(0.92) translate(-64, -64)">
    <!-- Arc 1: Top to Bottom-Right -->
    <path d="M 64 25 C 84 25 99 39 102 59" fill="none" stroke="url(#ribbon1)" stroke-width="8" stroke-linecap="round" />
    <!-- Arrow Head 1 -->
    <polygon points="102,66 94,54 107,56" fill="#6ee7b7" />

    <!-- Arc 2: Right to Bottom-Left -->
    <path d="M 97 73 C 88 92 70 102 50 101" fill="none" stroke="url(#ribbon2)" stroke-width="8" stroke-linecap="round" />
    <!-- Arrow Head 2 -->
    <polygon points="43,98 55,93 51,105" fill="#34d399" />

    <!-- Arc 3: Bottom-Left to Top -->
    <path d="M 39 88 C 26 73 28 50 43 36" fill="none" stroke="url(#ribbon3)" stroke-width="8" stroke-linecap="round" />
    <!-- Arrow Head 3 -->
    <polygon points="51,32 40,40 47,46" fill="#2dd4bf" />

    <!-- Core Centerpiece: Sprouting Eco Leaves -->
    <!-- Primary Leaf (Right) -->
    <path d="M 64 74 C 64 74 65 52 81 44 C 81 60 72 74 64 74 Z" fill="url(#leafGrad)" />
    <!-- Secondary Leaf (Left) -->
    <path d="M 64 74 C 64 74 58 56 46 51 C 47 64 54 74 64 74 Z" fill="#6ee7b7" opacity="0.9" />
    <!-- Leaf Stem / Pulse Spine -->
    <path d="M 64 78 L 64 56 C 68 53 72 49 76 46" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round" />

    <!-- Smart Civic Connected IoT Nodes -->
    <circle cx="64" cy="25" r="3.5" fill="#ffffff" />
    <circle cx="99" cy="62" r="3.5" fill="#ffffff" />
    <circle cx="46" cy="99" r="3.5" fill="#ffffff" />
    <circle cx="64" cy="48" r="2.5" fill="#ffffff" filter="url(#glow)" />
  </g>
</svg>
